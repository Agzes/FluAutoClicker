name: Release

on:
  push:
    tags:
      - "v.*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            artifact-name: FluAutoClicker-linux
            binary-path: src-tauri/target/release/fluautoclicker
            build-args: --bundles appimage,deb,rpm
          - name: windows
            os: windows-latest
            artifact-name: FluAutoClicker-windows
            binary-path: src-tauri/target/release/fluautoclicker.exe
            build-args: --no-bundle

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libappindicator3-dev \
            libevdev-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libxdo-dev \
            libxi-dev \
            libxtst-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            wget

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: taplo

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: ESLint
        run: pnpm run lint:js

      - name: Stylelint
        run: pnpm run lint:css

      - name: Static smoke check
        run: pnpm run smoke:static

      - name: i18n smoke check
        run: pnpm run smoke:i18n

      - name: Version check
        run: pnpm run version:check

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: TOML format check
        run: taplo check src-tauri/Cargo.toml

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build frontend
        run: pnpm run build

      - name: Bundle budget
        run: pnpm run budget

      - name: Build Tauri app
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -match 'beta') {
            pnpm tauri build --features beta-devtools ${{ matrix.build-args }}
          } else {
            pnpm tauri build ${{ matrix.build-args }}
          }

      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact-name }}
          if-no-files-found: error
          path: |
            ${{ matrix.binary-path }}
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-downloads

      - name: Prepare release body and assets
        id: release_meta
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $versionTag = $tag
          $assetVersion = $versionTag -replace '^v\.?', ''
          "name=$tag $([char]0x2022) FluAutoClicker [next]" >> $env:GITHUB_OUTPUT

          $notesPath = "docs/release-notes/$versionTag.md"

          if (-not (Test-Path $notesPath)) {
            throw "Release notes file was not found: $notesPath"
          }

          $changelog = Get-Content $notesPath |
            Where-Object { $_ -notmatch '^Release date:\s*' } |
            Out-String
          $encodedTag = [System.Uri]::EscapeDataString($tag)
          $fullChangelogUrl = "https://github.com/Agzes/FluAutoClicker/blob/$encodedTag/$notesPath"

          @"
          ![FluAutoClicker](https://github.com/Agzes/FluAutoClicker/blob/next/docs/readme/fluautoclicker.png)

          $changelog

          <div align="center">

          [Full changelog]($fullChangelogUrl)
          </div>
          "@ | Set-Content -Path release-body.md -Encoding UTF8

          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          Get-ChildItem release-downloads -Recurse -File |
            Where-Object {
              $_.Name -eq "fluautoclicker.exe" -or
              $_.Name -match '\.(AppImage|deb|rpm)$'
            } |
            ForEach-Object {
              $targetName = $_.Name
              switch -Regex ($_.Name) {
                '^fluautoclicker\.exe$' {
                  $targetName = "FluAutoClicker-$assetVersion-windows-x64.exe"
                  break
                }
                '\.AppImage$' {
                  $targetName = "FluAutoClicker-$assetVersion-linux-x64.AppImage"
                  break
                }
                '\.deb$' {
                  $targetName = "FluAutoClicker-$assetVersion-linux-x64.deb"
                  break
                }
                '\.rpm$' {
                  $targetName = "FluAutoClicker-$assetVersion-linux-x64.rpm"
                  break
                }
              }

              Copy-Item $_.FullName -Destination (Join-Path "release-assets" $targetName)
            }

          if (-not (Get-ChildItem release-assets -File)) {
            throw "No release assets were found after filtering."
          }

          $assetOrder = @(
            "FluAutoClicker-$assetVersion-windows-x64.exe",
            "FluAutoClicker-$assetVersion-linux-x64.AppImage",
            "FluAutoClicker-$assetVersion-linux-x64.deb",
            "FluAutoClicker-$assetVersion-linux-x64.rpm"
          )

          $assetOrder |
            Where-Object { Test-Path (Join-Path "release-assets" $_) } |
            ForEach-Object {
              $filePath = Join-Path "release-assets" $_
              $hash = (Get-FileHash $filePath -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $_"
            } |
            Set-Content -Path release-assets/SHA256SUMS.txt -Encoding ASCII

          "files<<EOF" >> $env:GITHUB_OUTPUT
          $assetOrder |
            Where-Object { Test-Path (Join-Path "release-assets" $_) } |
            ForEach-Object { "release-assets/$_" >> $env:GITHUB_OUTPUT }
          "release-assets/SHA256SUMS.txt" >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ steps.release_meta.outputs.name }}
          body_path: release-body.md
          prerelease: true
          files: ${{ steps.release_meta.outputs.files }}

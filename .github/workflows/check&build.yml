name: Check & Build

on:
  pull_request:
    paths:
      - ".github/workflows/check&build.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "vite.config.*"
      - "src/**"
      - "src-tauri/**"
  push:
    branches:
      - next
    paths:
      - ".github/workflows/check&build.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "vite.config.*"
      - "src/**"
      - "src-tauri/**"

permissions:
  contents: read

concurrency:
  group: check-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            artifact-name: FluAutoClicker-linux
            binary-path: src-tauri/target/release/fluautoclicker
            build-args: --bundles appimage,deb,rpm
          - name: windows
            os: windows-latest
            artifact-name: FluAutoClicker-windows
            binary-path: src-tauri/target/release/fluautoclicker.exe
            build-args: --no-bundle

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libappindicator3-dev \
            libevdev-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libxdo-dev \
            libxi-dev \
            libxtst-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            wget

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: taplo

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: ESLint
        run: pnpm run lint:js

      - name: Stylelint
        run: pnpm run lint:css

      - name: Static smoke check
        run: pnpm run smoke:static

      - name: i18n smoke check
        run: pnpm run smoke:i18n

      - name: Version check
        run: pnpm run version:check

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: TOML format check
        run: taplo check src-tauri/Cargo.toml

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build frontend
        run: pnpm run build

      - name: Bundle budget
        run: pnpm run budget

      - name: Build Tauri app
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -match 'beta') {
            pnpm tauri build --features beta-devtools ${{ matrix.build-args }}
          } else {
            pnpm tauri build ${{ matrix.build-args }}
          }

      - name: Upload app artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact-name }}
          if-no-files-found: error
          path: |
            ${{ matrix.binary-path }}
            src-tauri/target/release/bundle/**

  publish-nightly:
    name: Publish nightly
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/next'
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Prepare assets
        run: |
          mkdir -p nightly
          while IFS= read -r -d '' f; do
            case "$f" in
              *.AppImage) cp "$f" nightly/FluAutoClicker-nightly-linux-x86_64.AppImage ;;
              *.deb) cp "$f" nightly/FluAutoClicker-nightly-linux-x86_64.deb ;;
              *.rpm) cp "$f" nightly/FluAutoClicker-nightly-linux-x86_64.rpm ;;
              *.exe) cp "$f" nightly/FluAutoClicker-nightly-windows-x86_64.exe ;;
              *fluautoclicker) cp "$f" nightly/FluAutoClicker-nightly-linux-x86_64 ;;
            esac
          done < <(find artifacts -type f -print0)
          chmod +x nightly/FluAutoClicker-nightly-linux-x86_64 nightly/*.AppImage
          cd nightly
          sha256sum * > SHA256SUMS.txt

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Nightly build from \`next\` @ ${GITHUB_SHA:0:7} ($(date -u +%Y-%m-%d))."
            echo
            echo "Automated build, may be broken. CI run:"
            echo "https://github.com/${GITHUB_REPOSITORY}/actions?query=branch%3Anext"
          } > nightly-notes.md
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create nightly nightly/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "nightly $(date -u +%Y-%m-%d)" \
            --notes-file nightly-notes.md

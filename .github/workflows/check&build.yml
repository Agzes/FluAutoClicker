name: Check & Build

on:
  pull_request:
    paths:
      - ".github/workflows/check&build.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "vite.config.*"
      - "src/**"
      - "src-tauri/**"
  push:
    branches:
      - next
    paths:
      - ".github/workflows/check&build.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "vite.config.*"
      - "src/**"
      - "src-tauri/**"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            artifact-name: FluAutoClicker-linux
            binary-path: src-tauri/target/release/fluautoclicker
            build-args: --bundles appimage,deb,rpm
          - name: windows
            os: windows-latest
            artifact-name: FluAutoClicker-windows
            binary-path: src-tauri/target/release/fluautoclicker.exe
            build-args: --no-bundle

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libappindicator3-dev \
            libevdev-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libxdo-dev \
            libxi-dev \
            libxtst-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            wget

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Static smoke check
        run: pnpm run smoke:static

      - name: i18n smoke check
        run: pnpm run smoke:i18n

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build frontend
        run: pnpm run build

      - name: Build Tauri app
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -match 'beta') {
            pnpm tauri build --features beta-devtools ${{ matrix.build-args }}
          } else {
            pnpm tauri build ${{ matrix.build-args }}
          }

      - name: Upload app artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact-name }}
          if-no-files-found: error
          path: |
            ${{ matrix.binary-path }}
            src-tauri/target/release/bundle/**
